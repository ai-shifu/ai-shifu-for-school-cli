[project]
name = "ai-shifu-for-school-cli"
version = "0.1.0"
description = "CLI and agent skills for AI-Shifu for school"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2,<3", "python-dotenv>=1,<2"]

[project.urls]
Homepage = "https://github.com/ai-shifu/ai-shifu-for-school-cli"
Repository = "https://github.com/ai-shifu/ai-shifu-for-school-cli"
Issues = "https://github.com/ai-shifu/ai-shifu-for-school-cli/issues"

[project.scripts]
ai-shifu-for-school = "school_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["school_cli"]

[tool.hatch.build.targets.wheel.force-include]
skills = "school_cli/skills"

[tool.hatch.build.targets.sdist]
include = ["/school_cli", "/skills", "/tests", "/tools", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml", "/uv.lock", "/install.sh", "/install.ps1", "/.env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
